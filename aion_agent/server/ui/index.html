<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8">
<title>Aion Agent</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 会话管理（底部弹出） -->
<div id="sheet-mask" class="mask hidden"></div>
<div id="session-sheet" class="sheet hidden">
  <div class="sheet-head">
    <h2>会话</h2>
    <div class="sheet-actions">
      <button id="btn-new-session" class="btn-mini">✚ 新会话</button>
      <button id="btn-close-sheet" class="icon-btn" aria-label="关闭">✕</button>
    </div>
  </div>
  <div id="session-list" class="sheet-body"></div>
</div>

<!-- 视图 1：对话 -->
<div id="view-chat" class="view active">
  <header class="chat-topbar">
    <button id="btn-sessions" class="icon-btn" aria-label="会话管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="chat-title">
      <span id="session-title">新对话</span>
      <span id="model-info" class="sub">未连接</span>
    </div>
    <button id="btn-settings" class="icon-btn" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="config-banner" class="banner hidden"></div>
  <div id="notify-banner" class="notify hidden"></div>
  <main id="chat"></main>
  <footer id="composer">
    <button id="btn-attach" aria-label="上传图片" title="上传图片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="btn-send" disabled aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
  </footer>
  <div id="attachments" class="hidden"></div>
</div>

<!-- 视图 2：学习 -->
<div id="view-study" class="view">
  <header class="page-head">
    <h1>学习</h1>
    <span id="study-sub" class="sub"></span>
  </header>
  <div id="study-body" class="page-body"></div>
</div>

<!-- 视图 3：设置 -->
<div id="view-settings" class="view">
  <header class="page-head"><h1>设置</h1></header>
  <div id="settings-body" class="page-body"></div>
</div>

<!-- 底部导航 -->
<nav id="tabbar">
  <button class="tab active" data-tab="chat" aria-label="对话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
    <span>对话</span>
  </button>
  <button class="tab" data-tab="study" aria-label="学习">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    <span>学习</span>
  </button>
  <button class="tab" data-tab="settings" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    <span>设置</span>
  </button>
</nav>

<div id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
